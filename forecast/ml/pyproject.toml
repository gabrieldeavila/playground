[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "forecast-ml"
version = "0.0.1"
description = "Stock market forecasting models"
authors = [
  { name = "gabriel.avila" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "ipython",
    "joblib",
    "jupyterlab",
    "loguru",
    "matplotlib",
    "notebook",
    "numpy",
    "pandas",
    "pip",
    "pytest",
    "python-dotenv",
    "ruff",
    "scikit-learn",
    "tqdm",
    "typer",
]
requires-python = ">=3.10,<3.14"


[tool.ruff]
line-length = 99
src = ["forecast_ml"]
include = ["pyproject.toml", "forecast_ml/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["forecast_ml"]
force-sort-within-sections = true


