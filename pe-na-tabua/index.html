<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pé na Tábua</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><circle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%23ff7a2f%22/></svg>" />
    <style>
      :root {
        --ink: #fff7ec;
        --accent: #ff7a2f;
        --danger: #e8402e;
        --panel: rgba(16, 14, 22, 0.55);
      }
      [hidden] { display: none !important; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1622; color: var(--ink); }
      body { font: italic 800 16px/1.2 system-ui, 'Segoe UI', sans-serif; letter-spacing: 0.04em; }
      canvas { display: block; width: 100vw; height: 100vh; }

      #hud { position: fixed; inset: 0; pointer-events: none; text-transform: uppercase; text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6); }
      .panel { position: absolute; top: 20px; padding: 10px 16px; background: var(--panel); border-radius: 10px; backdrop-filter: blur(4px); }
      .panel.left { left: 20px; }
      .panel.right { right: 20px; text-align: right; }
      .label { font-size: 12px; opacity: 0.75; }
      .big { font-size: 40px; line-height: 1; }
      .small { font-size: 14px; opacity: 0.85; margin-top: 4px; font-variant-numeric: tabular-nums; }
      #hud-speed { font-variant-numeric: tabular-nums; min-width: 3ch; display: inline-block; }

      .health { position: absolute; bottom: 24px; width: min(32vw, 320px); }
      .health.you { left: 20px; }
      .health.rival { right: 20px; text-align: right; }
      .bar { height: 12px; margin-top: 6px; background: rgba(0, 0, 0, 0.5); border: 2px solid rgba(255, 255, 255, 0.6); border-radius: 8px; overflow: hidden; }
      .bar > div { height: 100%; width: 100%; background: linear-gradient(90deg, var(--danger), var(--accent) 50%, #ffd34d); transition: width 0.15s; }
      .rival .bar > div { margin-left: auto; background: linear-gradient(90deg, #ffd34d, var(--accent) 50%, var(--danger)); }

      .progress { position: absolute; top: 28px; left: 50%; width: min(40vw, 420px); height: 6px; transform: translateX(-50%); background: rgba(0, 0, 0, 0.45); border-radius: 3px; }
      .progress::after { content: ''; position: absolute; right: -2px; top: -6px; width: 4px; height: 18px; background: repeating-linear-gradient(#fff 0 3px, #111 3px 6px); }
      .dot { position: absolute; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: #e8e8e8; }
      .dot.me { width: 12px; height: 12px; margin: -6px 0 0 -6px; background: var(--accent); box-shadow: 0 0 8px var(--accent); z-index: 1; }

      .message { position: absolute; top: 34%; width: 100%; text-align: center; font-size: clamp(36px, 7vw, 84px); color: #ffe7b0; transition: opacity 0.25s; opacity: 0; }
      .hurt { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(220, 30, 20, 0.85)); }

      .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: linear-gradient(180deg, rgba(20, 16, 30, 0.35), rgba(20, 16, 30, 0.85)); text-shadow: 0 3px 10px rgba(0, 0, 0, 0.6); padding: 16px; }
      .screen h1 { margin: 0; font-size: clamp(40px, 8.5vw, 116px); letter-spacing: 0.04em; line-height: 1.05; background: linear-gradient(180deg, #ffe08a, var(--accent) 60%, #c2361c); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .screen h2 { margin: 0 0 16px; font-size: 48px; }
      .tagline { margin: 4px 0 28px; font-size: 18px; opacity: 0.85; }
      .controls { display: grid; grid-template-columns: auto auto; gap: 6px 20px; margin: 0 0 28px; font-size: 15px; }
      .controls dt { text-align: right; color: var(--accent); }
      .controls dd { margin: 0; text-align: left; }
      .cta { font-size: 20px; animation: blink 1.2s infinite; }
      .results { border-collapse: collapse; margin-bottom: 24px; font-size: 18px; min-width: min(90vw, 360px); }
      .results td { padding: 6px 14px; text-align: left; border-bottom: 1px solid rgba(255, 255, 255, 0.12); }
      .results td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
      .results tr.me { color: var(--accent); }
      @keyframes blink { 50% { opacity: 0.35; } }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud" hidden>
      <div class="hurt" id="hud-hurt"></div>
      <div class="panel left">
        <div class="label">Pos</div>
        <div class="big" id="hud-place">8/8</div>
        <div class="small" id="hud-time">0:00.0</div>
      </div>
      <div class="progress" id="hud-progress"></div>
      <div class="panel right">
        <div class="big"><span id="hud-speed">0</span></div>
        <div class="label">km/h</div>
      </div>
      <div class="health you">
        <div>You</div>
        <div class="bar"><div id="hud-health"></div></div>
      </div>
      <div class="health rival" id="hud-rival">
        <div id="hud-rival-name"></div>
        <div class="bar"><div id="hud-rival-health"></div></div>
      </div>
      <div class="message" id="hud-message"></div>
    </div>
    <div id="screen" class="screen" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
