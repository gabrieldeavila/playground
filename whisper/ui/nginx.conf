server {
  listen 3100;
  root /usr/share/nginx/html;
  index index.html;

  # Client-side routes like /recordings/:id must fall back to the SPA shell.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
